version: 2
updates:
  # Keeps the SHA-pinned actions in the workflows current; the version comments update with them.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  # Minor and patch updates arrive as one grouped PR; each major gets its own. The cooldown matches
  # min-release-age in .npmrc, so Dependabot doesn't propose a version npm would refuse; security updates skip it.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      npm:
        patterns: ['*']
        update-types: ['minor', 'patch']
