name: Copilot setup steps

# Prepares the GitHub Copilot coding agent's machine so it can run `npm run verify` without installing things
# by trial and error. Copilot runs only the job named copilot-setup-steps, and only from the default branch.
# It also runs when this file changes, so a broken setup fails in CI before it reaches the agent.
on:
  workflow_dispatch:
  push:
    paths: [.github/workflows/copilot-setup-steps.yml]
  pull_request:
    paths: [.github/workflows/copilot-setup-steps.yml]

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: npm ci
      # Install any other tools the tests need here (browsers, database servers, CLIs).
